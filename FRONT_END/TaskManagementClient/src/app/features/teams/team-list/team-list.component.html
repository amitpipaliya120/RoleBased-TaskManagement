<div class="row">
  <div class="col-md-6">
    <h2 class="fw-bold mb-4">Teams Directory</h2>
    <div class="card shadow-sm">
      <div class="card-body">
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let team of teams">
            <span class="fw-bold text-dark">{{ team.teamName }}</span>
            <button class="btn btn-outline-danger btn-sm" (click)="deleteTeam(team.teamId)">
              <i class="bi bi-trash"></i>
            </button>
          </li>
          <li class="list-group-item text-center text-muted" *ngIf="teams.length === 0">
            No teams created yet.
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card shadow-sm bg-light">
      <div class="card-body">
        <h5 class="card-title">Add New Team</h5>
        <form [formGroup]="teamForm" (ngSubmit)="saveTeam()">
          <div class="mb-3">
            <label class="form-label">Team Name</label>
            <input type="text" class="form-control" formControlName="teamName" placeholder="e.g. Frontend Developers"
                   [ngClass]="{'is-invalid': teamForm.get('teamName')?.invalid && teamForm.get('teamName')?.touched}">
            <div class="invalid-feedback">Team name must be at least 3 characters long.</div>
          </div>
          <button type="submit" class="btn btn-primary" [disabled]="teamForm.invalid">Create Team</button>
        </form>
      </div>
    </div>
  </div>
</div>
