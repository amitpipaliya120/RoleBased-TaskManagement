<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm" *ngIf="authService.isLoggedIn$ | async">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" routerLink="/dashboard"><i class="bi bi-kanban"></i> Task Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/tasks" routerLinkActive="active">Tasks</a>
        </li>
        <li class="nav-item" *ngIf="authService.getRole() === 'Admin' || authService.getRole() === 'Manager'">
          <a class="nav-link" routerLink="/admin/users" routerLinkActive="active">
            {{ authService.getRole() === 'Admin' ? 'Manage Employees' : 'My Team' }}
          </a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item">
          <span class="nav-link text-light"><i class="bi bi-person-circle"></i> {{ authService.getName() || 'User' }} ({{ authService.getRole() }})</span>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-light ms-2 btn-sm mt-1" (click)="logout()">Logout</button>
        </li>
      </ul>
    </div>
  </div>
</nav>
